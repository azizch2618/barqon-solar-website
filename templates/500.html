{% extends "layouts/site_base.html" %}

{% block title %}Service Temporarily Unavailable - BARQON{% endblock %}

    <div class="bq-wrap" style="max-width:760px;text-align:center;">
        <div class="bq-eyebrow" style="margin-inline:auto;margin-bottom:24px;">System Notice</div>
        <h1 class="bq-section-h2" style="margin-bottom:20px;">We are stabilizing this request.</h1>
        <p class="bq-text-muted" style="font-size:1.1rem;line-height:1.8;">
            The platform hit a temporary backend issue. Please retry in a moment.
        </p>
        <a href="{% url 'home' %}" class="bq-btn bq-btn-primary" style="margin-top:32px;">Back to Home</a>
    </div>
</section>
{% endblock %}
