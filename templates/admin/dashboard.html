            return (
                <Layout>
                    <ConfirmModal isOpen={!!deleteConfirm} {...deleteConfirm} onCancel={() => setDeleteConfirm(null)} />
                    <div className="mb-8">
                        <h2 className="text-3xl font-bold text-white tracking-tight">{id ? 'Edit' : 'New'} Project Completion</h2>
                        <p className="text-slate-400 mt-1">Record final financials and generate premium report</p>
                    </div>

                    <form onSubmit={handleSubmit} className="space-y-8 pb-20">
                        <Card className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="space-y-2">
                                <label className="text-sm font-bold text-slate-400 uppercase tracking-wider">Link to Project</label>
                                <select
                                    className="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-blue-500 outline-none"
                                    value={formData.project || ''}
                                    onChange={e => setFormData({ ...formData, project: e.target.value })}
                                >
                                    <option value="">Select Project (Optional)</option>
                                    {projects.map(p => (
                                        <option key={p.id} value={p.id}>{p.title}</option>
                                    ))}
                                </select>
                            </div>
                            <div className="space-y-2">
                                <label className="text-sm font-bold text-slate-400 uppercase tracking-wider">Owner Name</label>
                                <input
                                    type="text" required
                                    className="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-blue-500 outline-none"
                                    value={formData.owner_name}
                                    onChange={e => setFormData({ ...formData, owner_name: e.target.value })}
                                    placeholder="e.g. Engr M Hassan"
                                />
                            </div>
                            <div className="md:col-span-2 space-y-2">
                                <label className="text-sm font-bold text-slate-400 uppercase tracking-wider">Relevant Details</label>
                                <textarea
                                    className="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-blue-500 outline-none h-24"
                                    value={formData.details}
                                    onChange={e => setFormData({ ...formData, details: e.target.value })}
                                    placeholder="Write any specific notes or details about the project completion..."
                                />
                            </div>
                        </Card>

                        <div>
                            <div className="flex justify-between items-center mb-4">
                                <h3 className="text-xl font-bold text-white flex items-center gap-2"><Icon name="Package" className="text-blue-400" /> Itemized Breakdown</h3>
                                <Button type="button" onClick={addItem} variant="outline" icon="Plus" className="text-xs py-1">Add Item</Button>
                            </div>

                            <div className="space-y-4">
                                {formData.items.map((item, index) => (
                                    <div key={index} className="glass-card p-4 grid grid-cols-1 md:grid-cols-12 gap-4 items-end relative group">
                                        <div className="md:col-span-3 space-y-1">
                                            <label className="text-[10px] font-bold text-slate-500 uppercase">Item Name</label>
                                            <input type="text" className="w-full bg-slate-900/50 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm" value={item.name} onChange={e => updateItem(index, 'name', e.target.value)} placeholder="e.g. Inverter" />
                                        </div>
                                        <div className="md:col-span-3 space-y-1">
                                            <label className="text-[10px] font-bold text-slate-500 uppercase">Description</label>
                                            <input type="text" className="w-full bg-slate-900/50 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm" value={item.description} onChange={e => updateItem(index, 'description', e.target.value)} placeholder="Specs..." />
                                        </div>
                                        <div className="md:col-span-1 space-y-1">
                                            <label className="text-[10px] font-bold text-slate-500 uppercase">Qty</label>
                                            <input type="number" className="w-full bg-slate-900/50 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm text-center" value={item.qty} onChange={e => updateItem(index, 'qty', e.target.value)} />
                                        </div>
                                        <div className="md:col-span-2 space-y-1">
                                            <label className="text-[10px] font-bold text-slate-500 uppercase">Cost Price</label>
                                            <input type="number" className="w-full bg-slate-900/50 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm" value={item.cost} onChange={e => updateItem(index, 'cost', e.target.value)} />
                                        </div>
                                        <div className="md:col-span-2 space-y-1">
                                            <label className="text-[10px] font-bold text-slate-500 uppercase">Selling Price</label>
                                            <input type="number" className="w-full bg-slate-900/50 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm font-bold text-emerald-400" value={item.price} onChange={e => updateItem(index, 'price', e.target.value)} />
                                        </div>
                                        <div className="md:col-span-1 flex justify-center">
                                            <button type="button" onClick={() => removeItem(index)} className="text-red-500 hover:bg-red-500/10 p-2 rounded-lg"><Icon name="Trash2" size={18} /></button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <Card className="bg-slate-800/50 border-blue-500/20">
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                <div>
                                    <p className="text-slate-400 text-sm mb-1">Total Market Value (Investment)</p>
                                    <p className="text-2xl font-bold text-white">RS {totals.cost.toLocaleString()}</p>
                                </div>
                                <div>
                                    <p className="text-slate-400 text-sm mb-1">Total Selling Amount (Revenue)</p>
                                    <p className="text-2xl font-bold text-emerald-400">RS {totals.revenue.toLocaleString()}</p>
                                </div>
                                <div className="bg-blue-500/10 p-4 rounded-xl border border-blue-500/20">
                                    <p className="text-blue-400 text-xs font-bold uppercase mb-1">Project Net Profit</p>
                                    <p className={`text-3xl font-black ${totals.profit >= 0 ? 'text-blue-400' : 'text-red-400'}`}>RS {totals.profit.toLocaleString()}</p>
                                </div>
                            </div>
                        </Card>

                        <div className="flex gap-4 justify-end">
                            <Button type="button" variant="outline" onClick={() => navigate('/admin-dashboard/project-financials')}>Cancel</Button>
                            <Button type="submit" loading={saving} icon="Check">Save Record</Button>
                        </div>
                    </form>
                </Layout>
            );
        };

        const CareersManagement = () => {
            const [positions, setPositions] = useState([]);
            const [applications, setApplications] = useState([]);
            const [loading, setLoading] = useState(true);
            const [view, setView] = useState('positions'); // 'positions' or 'applications'
            const [showModal, setShowModal] = useState(false);
            const [editingPosition, setEditingPosition] = useState(null);
            const [formData, setFormData] = useState({ title: '', location: '', job_type: 'full_time', description: '', requirements: '', is_active: true });
            const navigate = useNavigate();

            useEffect(() => {
                fetchData();
            }, []);

            const fetchData = async () => {
                setLoading(true);
                try {
                    const [posRes, appRes] = await Promise.all([
                        api.get('job-positions/'),
                        api.get('job-applications/')
                    ]);
                    setPositions(posRes.data);
                    setApplications(appRes.data);
                } catch (e) {
                    console.error("Error fetching career data", e);
                } finally {
                    setLoading(false);
                }
            };

            const handleSavePosition = async (e) => {
                e.preventDefault();
                try {
                    if (editingPosition) {
                        await api.put(`job-positions/${editingPosition.id}/`, formData);
                    } else {
                        await api.post('job-positions/', formData);
                    }
                    setShowModal(false);
                    setEditingPosition(null);
                    setFormData({ title: '', location: '', job_type: 'full_time', description: '', requirements: '', is_active: true });
                    fetchData();
                } catch (e) {
                    alert("Error saving position");
                }
            };

            const handleDeletePosition = async (id) => {
                if (!confirm("Are you sure? This will delete all applications for this position too.")) return;
                try {
                    await api.delete(`job-positions/${id}/`);
                    fetchData();
                } catch (e) {
                    alert("Error deleting position");
                }
            };

            const handleUpdateAppStatus = async (id, status) => {
                try {
                    await api.patch(`job-applications/${id}/`, { status });
                    fetchData();
                } catch (e) {
                    alert("Error updating status");
                }
            };

            return (
                <Layout>
                    <div className="flex justify-between items-center mb-8">
                        <div>
                            <h2 className="text-3xl font-bold text-white tracking-tight">Careers & Recruitment</h2>
                            <p className="text-slate-400 mt-1">Manage job openings and candidate applications</p>
                        </div>
                        <div className="flex gap-2">
                            <Button variant={view === 'positions' ? 'primary' : 'outline'} onClick={() => setView('positions')}>Positions</Button>
                            <Button variant={view === 'applications' ? 'primary' : 'outline'} onClick={() => setView('applications')}>Applications ({applications.length})</Button>
                            <Button icon="Plus" onClick={() => { setEditingPosition(null); setFormData({ title: '', location: '', job_type: 'full_time', description: '', requirements: '', is_active: true }); setShowModal(true); }}>Post Job</Button>
                        </div>
                    </div>

                    {loading ? (
                        <div className="text-center py-20 text-slate-500">Loading data...</div>
                    ) : view === 'positions' ? (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            {positions.map(pos => (
                                <Card key={pos.id} className="relative group">
                                    <div className="flex justify-between items-start mb-4">
                                        <div>
                                            <span className={`text-[10px] uppercase font-bold px-2 py-0.5 rounded ${pos.is_active ? 'bg-emerald-500/10 text-emerald-400' : 'bg-slate-700 text-slate-400'}`}>
                                                {pos.is_active ? 'Active' : 'Draft'}
                                            </span>
                                            <h3 className="text-xl font-bold text-white mt-2">{pos.title}</h3>
                                            <p className="text-slate-500 text-sm flex items-center gap-1 mt-1"><Icon name="MapPin" size={12} /> {pos.location} • {pos.job_type_display}</p>
                                        </div>
                                        <div className="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                            <button onClick={() => { setEditingPosition(pos); setFormData(pos); setShowModal(true); }} className="p-2 text-blue-400 hover:bg-blue-400/10 rounded-lg"><Icon name="Edit" size={18} /></button>
                                            <button onClick={() => handleDeletePosition(pos.id)} className="p-2 text-red-400 hover:bg-red-400/10 rounded-lg"><Icon name="Trash2" size={18} /></button>
                                        </div>
                                    </div>
                                    <p className="text-slate-400 text-sm line-clamp-2 mb-6">{pos.description}</p>
                                    <div className="flex justify-between items-center pt-4 border-t border-slate-700/50">
                                        <span className="text-slate-500 text-xs font-medium uppercase tracking-wider">{pos.applications_count} Applications</span>
                                        <Button variant="outline" className="text-xs" onClick={() => { setView('applications'); /* filter logic could go here */ }}>View Applicants</Button>
                                    </div>
                                </Card>
                            ))}
                        </div>
                    ) : (
                        <div className="glass-card overflow-hidden">
                            <table className="w-full text-left">
                                <thead className="bg-slate-900/50 text-slate-400 text-xs uppercase font-bold border-b border-slate-700/50">
                                    <tr>
                                        <th className="px-6 py-4">Candidate</th>
                                        <th className="px-6 py-4">Position</th>
                                        <th className="px-6 py-4">Exp</th>
                                        <th className="px-6 py-4">Status</th>
                                        <th className="px-6 py-4">Actions</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-700/30">
                                    {applications.map(app => (
                                        <tr key={app.id} className="hover:bg-slate-800/30 transition-colors">
                                            <td className="px-6 py-4">
                                                <p className="text-white font-bold">{app.full_name}</p>
                                                <p className="text-slate-500 text-xs">{app.email} • {app.phone}</p>
                                            </td>
                                            <td className="px-6 py-4 text-slate-300 font-medium">{app.position_title}</td>
                                            <td className="px-6 py-4 text-slate-400">{app.experience_years}y</td>
                                            <td className="px-6 py-4">
                                                <select
                                                    className={`bg-slate-800 border-none rounded px-2 py-1 text-xs font-bold uppercase tracking-wider outline-none ${app.status === 'hired' ? 'text-emerald-400' : app.status === 'rejected' ? 'text-red-400' : 'text-blue-400'}`}
                                                    value={app.status}
                                                    onChange={(e) => handleUpdateAppStatus(app.id, e.target.value)}
                                                >
                                                    <option value="new">New</option>
                                                    <option value="reviewing">Reviewing</option>
                                                    <option value="shortlisted">Shortlisted</option>
                                                    <option value="rejected">Rejected</option>
                                                    <option value="hired">Hired</option>
                                                </select>
                                            </td>
                                            <td className="px-6 py-4">
                                                <div className="flex gap-3">
                                                    <a href={app.cv_url} target="_blank" className="text-blue-400 hover:text-blue-300 flex items-center gap-1 text-xs font-bold uppercase"><Icon name="Download" size={14} /> CV</a>
                                                    {app.cover_letter && (
                                                        <button onClick={() => alert(app.cover_letter)} className="text-slate-400 hover:text-white uppercase text-xs font-bold tracking-widest">Letter</button>
                                                    )}
                                                </div>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}

                    {showModal && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-md flex items-center justify-center z-[9999] p-4">
                            <div className="glass-card w-full max-w-2xl p-8 overflow-y-auto max-h-[90vh]">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="text-2xl font-bold text-white">{editingPosition ? 'Edit Job Opening' : 'Post New Position'}</h3>
                                    <button onClick={() => setShowModal(false)} className="text-slate-500 hover:text-white"><Icon name="X" /></button>
                                </div>
                                <form onSubmit={handleSavePosition} className="space-y-4">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="space-y-1">
                                            <label className="text-xs font-bold text-slate-500 uppercase">Title</label>
                                            <input type="text" required className="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white" value={formData.title} onChange={e => setFormData({ ...formData, title: e.target.value })} />
                                        </div>
                                        <div className="space-y-1">
                                            <label className="text-xs font-bold text-slate-500 uppercase">Location</label>
                                            <input type="text" required className="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white" value={formData.location} onChange={e => setFormData({ ...formData, location: e.target.value })} />
                                        </div>
                                    </div>
                                    <div className="space-y-1">
                                        <label className="text-xs font-bold text-slate-500 uppercase">Job Type</label>
                                        <select className="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white" value={formData.job_type} onChange={e => setFormData({ ...formData, job_type: e.target.value })}>
                                            <option value="full_time">Full Time</option>
                                            <option value="part_time">Part Time</option>
                                            <option value="contract">Contract</option>
                                            <option value="internship">Internship</option>
                                        </select>
                                    </div>
                                    <div className="space-y-1">
                                        <label className="text-xs font-bold text-slate-500 uppercase">Description</label>
                                        <textarea required className="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white h-24" value={formData.description} onChange={e => setFormData({ ...formData, description: e.target.value })} />
                                    </div>
                                    <div className="space-y-1">
                                        <label className="text-xs font-bold text-slate-500 uppercase">Requirements</label>
                                        <textarea required className="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white h-24" value={formData.requirements} onChange={e => setFormData({ ...formData, requirements: e.target.value })} />
                                    </div>
                                    <label className="flex items-center gap-3 cursor-pointer">
                                        <input type="checkbox" checked={formData.is_active} onChange={e => setFormData({ ...formData, is_active: e.target.checked })} />
                                        <span className="text-slate-300">Published (Visible to candidates)</span>
                                    </label>
                                    <div className="pt-4 flex gap-4">
                                        <Button type="submit" className="flex-1" icon="Check">Save Position</Button>
                                        <Button type="button" variant="outline" onClick={() => setShowModal(false)}>Cancel</Button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </Layout>
            );
        };


        const App = () => {

            const [isAuth, setIsAuth] = useState(!!localStorage.getItem('access_token'));

            return (
                <ToastProvider>
                    <BrowserRouter>
                        <Routes>
                            <Route path="/admin-login" element={<Login />} />
                            <Route path="/admin-dashboard" element={<Dashboard />} />
                            <Route path="/admin-dashboard/projects" element={<ProjectManagement />} />
                            <Route path="/admin-dashboard/leads" element={<LeadsList />} />
                            <Route path="/admin-dashboard/quotations" element={<QuotationsList />} />
                            <Route path="/admin-dashboard/quotation-builder/:leadId" element={<QuotationBuilderPage />} />
                            <Route path="/admin-dashboard/tools/calculator" element={<EngineeringTools />} />
                            <Route path="/admin-dashboard/staff" element={<StaffPayrollManager />} />

                            <Route path="/admin-dashboard/project-financials" element={<ProjectFinancialsList />} />
                            <Route path="/admin-dashboard/project-financials/new" element={<ProjectFinancialsForm />} />
                            <Route path="/admin-dashboard/project-financials/edit/:id" element={<ProjectFinancialsForm />} />

                            <Route path="/admin-dashboard/reviews" element={<ReviewManagement />} />
                            <Route path="/admin-dashboard/blogs" element={<BlogManagement />} />
                            <Route path="/admin-dashboard/installations" element={<InstallationManagement />} />
                            <Route path="/admin-dashboard/careers" element={<CareersManagement />} />
                        </Routes>
                    </BrowserRouter>
                </ToastProvider>
            );
        };

        const renderApp = () => {
            const rootElement = document.getElementById('root');
            const root = ReactDOM.createRoot(rootElement);
            root.render(<App />);
        };

        if (window.lucide) {
            renderApp();
        } else {
            window.addEventListener('load', renderApp);
        }
        /* {% endverbatim %} */
    </script>
</body>

</html>
