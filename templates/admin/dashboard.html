{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BARQON Solar - CRM & Engineering</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS (Play CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        dark: {
                            900: '#0B0F19',
                            800: '#111827',
                            700: '#1F2937',
                        },
                        primary: {
                            50: '#fdf8f6',
                            100: '#f2e8e5',
                            200: '#eaddd7',
                            300: '#e0cec7',
                            400: '#d2bab0',
                            500: '#c5a799',
                            600: '#ab816f',
                            700: '#946654',
                            800: '#7a4f3f',
                            900: '#54362a',
                        },
                        accent: '#3b82f6',
                    },
                    animation: {
                        'blob': 'blob 7s infinite',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- React Router -->
    <script src="https://unpkg.com/@remix-run/router@1.16.0/dist/router.umd.min.js"></script>
    <script src="https://unpkg.com/react-router@6.23.0/dist/umd/react-router.production.min.js"></script>
    <script src="https://unpkg.com/react-router-dom@6.23.0/dist/umd/react-router-dom.production.min.js"></script>

    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- Recharts and its dependencies -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            background-color: #0B0F19;
            /* Premium deep dark */
            color: #f8fafc;
            font-family: 'Outfit', system-ui, -apple-system, sans-serif;
            background-image: radial-gradient(circle at top right, rgba(16, 185, 129, 0.03), transparent 40%),
                radial-gradient(circle at bottom left, rgba(59, 130, 246, 0.03), transparent 40%);
            background-attachment: fixed;
        }

        .glass-card {
            background: rgba(17, 24, 39, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 1.25rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .glow-border {
            position: relative;
        }

        .glow-border::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(to right, rgba(16, 185, 129, 0.5), rgba(59, 130, 246, 0.5));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .glow-border:hover::before,
        .glow-border.active::before {
            opacity: 1;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(51, 65, 85, 0.8);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(71, 85, 105, 1);
        }

        /* Form Transitions */
        .step-transition-enter {
            opacity: 0;
            transform: translateX(20px);
        }

        .step-transition-enter-active {
            opacity: 1;
            transform: translateX(0);
            transition: opacity 300ms, transform 300ms;
        }

        .step-transition-exit {
            opacity: 1;
            transform: translateX(0);
        }

        .step-transition-exit-active {
            opacity: 0;
            transform: translateX(-20px);
            transition: opacity 300ms, transform 300ms;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        /* {% verbatim %} */
        // --- UTILS & COMPONENTS ---

        const Card = ({ children, className = "" }) => (
            <div className={`glass-card p-6 ${className}`}>{children}</div>
        );

        const Button = ({ children, onClick, className = "", variant = "primary", icon, loading, type = "button" }) => {
            const variants = {
                primary: "bg-blue-600 hover:bg-blue-500 text-white shadow-blue-500/20",
                secondary: "bg-slate-700 hover:bg-slate-600 text-white",
                danger: "bg-red-600 hover:bg-red-500 text-white shadow-red-500/20",
                success: "bg-emerald-600 hover:bg-emerald-500 text-white shadow-emerald-500/20",
                outline: "border border-slate-600 hover:border-slate-500 text-slate-300 hover:text-white"
            };
            return (
                <button
                    type={type}
                    disabled={loading}
                    onClick={onClick}
                    className={`flex items-center justify-center gap-2 px-4 py-2 rounded-lg font-medium transition-all duration-200 disabled:opacity-50 ${variants[variant]} ${className}`}
                >
                    {loading ? <Icon name="Loader2" className="animate-spin" size={18} /> : icon && <Icon name={icon} size={18} />}
                    {children}
                </button>
            );
        };

        const ConfirmModal = ({ isOpen, title, message, onConfirm, onCancel, onClose, confirmText = "Confirm", variant = "danger", type = "danger" }) => {
            if (!isOpen) return null;
            const finalCancel = onClose || onCancel;
            const finalVariant = variant || type;
            return (
                <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-md flex items-center justify-center z-[9999] p-4 animate-in fade-in duration-300">
                    <div className="glass-card max-w-sm w-full p-8 border border-slate-700/50 shadow-2xl scale-in-center text-center">
                        <div className={`w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-6 ${finalVariant === 'danger' ? 'bg-red-500/10 text-red-500' : 'bg-blue-500/10 text-blue-500'}`}>
                            <Icon name={finalVariant === 'danger' ? 'Trash2' : 'AlertTriangle'} size={32} />
                        </div>
                        <h3 className="text-2xl font-bold text-white mb-2">{title}</h3>
                        <p className="text-slate-400 mb-8 text-sm leading-relaxed">{message}</p>
                        <div className="flex gap-4 w-full">
                            <button onClick={finalCancel} className="flex-1 px-4 py-3 rounded-xl font-bold text-slate-400 hover:bg-slate-800 transition-colors">Cancel</button>
                            <button onClick={onConfirm} className={`flex-1 px-4 py-3 rounded-xl font-bold text-white transition-all shadow-lg ${finalVariant === 'danger' ? 'bg-red-600 hover:bg-red-500 shadow-red-500/20' : 'bg-blue-600 hover:bg-blue-500 shadow-blue-500/20'}`}>
                                {confirmText}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };
        const { useState, useEffect, useRef, useMemo } = React;
        const { BrowserRouter, Routes, Route, Link, useNavigate, useParams, useLocation } = ReactRouterDOM;
        const { LineChart, Line, BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, AreaChart, Area } = window.Recharts;

        // Custom Lucide Icon Component Fallback
        const Icon = ({ name, size = 24, className = "" }) => {
            const iconRef = React.useRef(null);

            useEffect(() => {
                if (window.lucide && iconRef.current) {
                    const iconName = name.charAt(0).toUpperCase() + name.slice(1);
                    const lucideIcon = window.lucide.icons[iconName] || window.lucide.icons[name];

                    if (lucideIcon) {
                        window.lucide.createIcons({
                            icons: { [name]: lucideIcon },
                            nameAttr: 'data-lucide',
                            attrs: {
                                class: className,
                                width: size,
                                height: size,
                                stroke: 'currentColor',
                                'stroke-width': 2,
                                'stroke-linecap': 'round',
                                'stroke-linejoin': 'round'
                            }
                        });
                    } else {
                        console.warn(`Lucide icon not found: ${name}`);
                    }
                }
            }, [name, size, className]);

            return <i ref={iconRef} data-lucide={name}></i>;
        };

        const getCSRFToken = () => {
            let csrfToken = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, 10) === ('csrftoken=')) {
                        csrfToken = decodeURIComponent(cookie.substring(10));
                        break;
                    }
                }
            }
            return csrfToken;
        };

        const api = axios.create({
            baseURL: '/api/',
            headers: {
                'Content-Type': 'application/json'
            }
        });

        api.interceptors.request.use((config) => {
            const token = localStorage.getItem('access_token');
            if (token) {
                config.headers.Authorization = `Bearer ${token}`;
            }
            const csrfToken = getCSRFToken();
            if (csrfToken) {
                config.headers['X-CSRFToken'] = csrfToken;
            }
            return config;
        });

        // --- COMPONENTS ---

        const Sidebar = ({ isOpen, onClose }) => {
            const navigate = useNavigate();
            const location = useLocation();

            const handleLogout = () => {
                localStorage.removeItem('access_token');
                localStorage.removeItem('refresh_token');
                navigate('/admin-login');
            };

            const navItems = [
                { path: '/admin-dashboard', icon: 'LayoutDashboard', label: 'Dashboard' },
                { path: '/admin-dashboard/projects', icon: 'Folder', label: 'Project Management' },
                { path: '/admin-dashboard/leads', icon: 'Users', label: 'Lead Management' },
                { path: '/admin-dashboard/quotations', icon: 'FileText', label: 'Quotations' },
                { path: '/admin-dashboard/tools/calculator', icon: 'Wrench', label: 'Engineering Tools' },
                { path: '/admin-dashboard/staff', icon: 'UserCog', label: 'Staff & Payroll' },
                { path: '/admin-dashboard/project-financials', icon: 'BarChart3', label: 'Project Financials' },
                { path: '/admin-dashboard/reviews', icon: 'Star', label: 'Client Reviews' },
                { path: '/admin-dashboard/blogs', icon: 'BookOpen', label: 'Solar Insights' },
                { path: '/admin-dashboard/installations', icon: 'Image', label: 'Installations' },
                { path: '/admin-dashboard/careers', icon: 'Briefcase', label: 'Careers' },
            ];

            return (
                <div className={`fixed inset-y-0 left-0 z-50 w-64 glass-card h-screen border-r border-slate-700/50 flex flex-col pt-6 shadow-2xl transition-transform duration-300 transform lg:translate-x-0 ${isOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                    <div className="px-6 mb-8 flex justify-between items-center">
                        <div className="flex items-center gap-3">
                            <img src="/static/images/logo.png" className="h-10 w-auto rounded-lg shadow-lg shadow-blue-500/20" alt="BARQON" />
                            <div>
                                <h1 className="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">BARQON</h1>
                                <p className="text-[10px] text-slate-400 uppercase tracking-widest font-semibold">SaaS Portal</p>
                            </div>
                        </div>
                        <button onClick={onClose} className="lg:hidden text-slate-400 hover:text-white p-2">
                            <Icon name="X" size={20} />
                        </button>
                    </div>

                    <nav className="flex-1 px-4 space-y-1 overflow-y-auto">
                        {navItems.map(item => {
                            const isActive = location.pathname === item.path || (item.path !== '/admin-dashboard' && location.pathname.startsWith(item.path));
                            return (
                                <Link key={item.path} to={item.path} onClick={() => window.innerWidth < 1024 && onClose()} className={`flex items-center gap-3 px-4 py-3 rounded-lg transition-all duration-200 ${isActive ? 'bg-blue-500/20 text-blue-400 border border-blue-500/30 shadow-lg shadow-blue-500/10' : 'text-slate-400 hover:text-white hover:bg-slate-800/50'}`}>
                                    <Icon name={item.icon} size={20} />
                                    <span className="font-medium">{item.label}</span>
                                </Link>
                            )
                        })}
                    </nav>

                    <div className="p-4 border-t border-slate-700/50">
                        <button onClick={handleLogout} className="flex items-center gap-3 text-slate-400 hover:text-red-400 px-4 py-2 w-full transition-colors rounded-lg hover:bg-red-500/10">
                            <Icon name="LogOut" size={20} />
                            <span className="font-medium">Logout</span>
                        </button>
                    </div>
                </div>
            )
        };

        const TopNavbar = ({ onMenuClick }) => {
            const [notifications, setNotifications] = useState([]);
            const [showDropdown, setShowDropdown] = useState(false);
            const navigate = useNavigate();
            const toast = useToast();
            const lastCountRef = useRef(0);

            const fetchNotifications = async (isFirst = false) => {
                try {
                    const all = await api.get('contact/');
                    const unviewed = all.data.filter(l => !l.is_viewed);

                    // Show popup if new leads arrived (and not the first load)
                    if (!isFirst && unviewed.length > lastCountRef.current) {
                        const newOnes = unviewed.length - lastCountRef.current;
                        toast(`${newOnes} New Lead(s) received!`, 'info');
                    }

                    lastCountRef.current = unviewed.length;
                    setNotifications(unviewed.slice(0, 5));
                } catch (e) { }
            };

            useEffect(() => {
                fetchNotifications(true);
                const interval = setInterval(() => fetchNotifications(false), 30000); // Check every 30s
                return () => clearInterval(interval);
            }, []);

            const handleToggleDropdown = () => {
                if (!showDropdown && notifications.length > 0) {
                    // Optional: Mark all as viewed when opening the dropdown
                    // api.post('contact/mark_all_viewed/').then(() => fetchNotifications(true));
                }
                setShowDropdown(!showDropdown);
            };

            const handleMarkViewed = (id) => {
                api.post(`contact/${id}/mark_as_viewed/`).then(() => {
                    fetchNotifications(true);
                });
            };

            return (
                <div className="h-16 glass-card border-b border-slate-700/50 flex justify-between items-center px-4 md:px-8 sticky top-0 z-40 relative">
                    <div className="flex items-center gap-4">
                        <button onClick={onMenuClick} className="lg:hidden text-slate-400 hover:text-white p-2 glass-card">
                            <Icon name="Menu" size={24} />
                        </button>
                        <div className="text-slate-300 font-medium hidden sm:block">Overview</div>
                    </div>
                    <div className="flex items-center gap-3 md:gap-6 text-slate-400">
                        <div className="relative">
                            <button onClick={handleToggleDropdown} className={`hover:text-white transition-colors relative ${showDropdown ? 'text-white' : ''}`}>
                                <Icon name="Bell" size={20} />
                                {notifications.length > 0 && (
                                    <>
                                        <span className="absolute -top-1 -right-1 w-2 h-2 bg-red-500 rounded-full animate-ping"></span>
                                        <span className="absolute -top-1 -right-1 w-2 h-2 bg-red-500 rounded-full"></span>
                                    </>
                                )}
                            </button>
                            {showDropdown && (
                                <div className="absolute right-0 mt-4 w-80 bg-slate-800 border border-slate-700 rounded-xl shadow-2xl overflow-hidden z-50">
                                    <div className="p-3 bg-slate-900 border-b border-slate-700 flex justify-between items-center">
                                        <h4 className="text-sm font-bold text-white uppercase tracking-tighter">New Inquiries</h4>
                                        <button onClick={() => api.post('contact/mark_all_viewed/').then(() => fetchNotifications(true))} className="text-[10px] text-blue-400 hover:text-white uppercase font-bold">Mark all read</button>
                                    </div>
                                    <div className="max-h-80 overflow-y-auto">
                                        {notifications.length === 0 ? (
                                            <div className="p-8 text-center text-slate-500 text-sm flex flex-col items-center gap-2">
                                                <Icon name="CheckCircle2" size={32} className="opacity-20" />
                                                All caught up!
                                            </div>
                                        ) : (
                                            notifications.map(n => (
                                                <div key={n.id} onClick={() => { handleMarkViewed(n.id); setShowDropdown(false); navigate('/admin-dashboard/leads'); }} className="p-4 border-b border-slate-700/50 hover:bg-slate-700/50 cursor-pointer transition-colors group relative">
                                                    <div className="flex justify-between items-start mb-1">
                                                        <p className="text-sm font-bold text-white group-hover:text-blue-400 transition-colors">New Lead: {n.name}</p>
                                                        <div className="w-2 h-2 bg-blue-500 rounded-full"></div>
                                                    </div>
                                                    <p className="text-xs text-slate-400 flex items-center gap-1"><Icon name="MapPin" size={10} /> {n.city_area || 'Unknown City'}</p>
                                                    <p className="text-[10px] text-slate-500 mt-2 font-medium">{new Date(n.created_at).toLocaleString()}</p>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            )}
                        </div>
                        <div className="w-px h-6 bg-slate-700"></div>
                        <div className="flex items-center gap-2">
                            <div className="w-8 h-8 rounded-full bg-gradient-to-r from-blue-500 to-emerald-500 flex items-center justify-center text-white font-bold text-sm shadow-lg shadow-emerald-500/20">
                                A
                            </div>
                            <span className="font-medium text-sm text-slate-300">Admin User</span>
                        </div>
                    </div>
                </div>
            );
        };

        const Layout = ({ children }) => {
            const [sidebarOpen, setSidebarOpen] = useState(false);

            return (
                <div className="flex bg-slate-900 min-h-screen text-slate-300 font-sans">
                    {/* Mobile Overlay */}
                    {sidebarOpen && (
                        <div
                            className="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 lg:hidden transition-opacity duration-300"
                            onClick={() => setSidebarOpen(false)}
                        ></div>
                    )}

                    <Sidebar isOpen={sidebarOpen} onClose={() => setSidebarOpen(false)} />
                    <div className="flex-1 lg:ml-64 flex flex-col h-screen overflow-hidden w-full">
                        <TopNavbar onMenuClick={() => setSidebarOpen(true)} />
                        <main className="flex-1 p-4 md:p-8 overflow-y-auto relative w-full">
                            <div className="max-w-7xl mx-auto">
                                {children}
                            </div>
                        </main>
                    </div>
                </div>
            )
        };

        const Login = () => {
            const [username, setUsername] = useState("");
            const [password, setPassword] = useState("");
            const navigate = useNavigate();

            const handleSubmit = async (e) => {
                e.preventDefault();
                try {
                    const res = await axios.post('/api/token/', { username, password });
                    localStorage.setItem('access_token', res.data.access);
                    localStorage.setItem('refresh_token', res.data.refresh);
                    navigate('/admin-dashboard');
                } catch (err) {
                    alert("Login failed! Invalid credentials.");
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-slate-900 relative overflow-hidden">
                    {/* Background blob */}
                    <div className="absolute top-[20%] left-[20%] w-96 h-96 bg-blue-500/20 rounded-full blur-[100px]"></div>
                    <div className="absolute bottom-[20%] right-[20%] w-96 h-96 bg-emerald-500/20 rounded-full blur-[100px]"></div>

                    <div className="glass-card w-full max-w-md p-8 relative z-10 border border-slate-700/50">
                        <div className="text-center mb-8">
                            <h2 className="text-3xl font-bold text-white mb-2 flex items-center justify-center gap-2">
                                <Icon name="Sun" className="text-yellow-400" />
                                Admin Portal
                            </h2>
                            <p className="text-slate-400">Sign in to manage the solar engine</p>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-6">
                            <div className="relative group">
                                <input type="text" id="username" className="peer w-full bg-slate-800/50 border border-slate-600 rounded-lg px-4 pt-6 pb-2 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all placeholder-transparent"
                                    placeholder="Username" value={username} onChange={e => setUsername(e.target.value)} required />
                                <label htmlFor="username" className="absolute left-4 top-2 text-xs font-semibold text-blue-400 transition-all peer-placeholder-shown:text-sm peer-placeholder-shown:font-normal peer-placeholder-shown:text-slate-400 peer-placeholder-shown:top-4 peer-focus:top-2 peer-focus:text-xs peer-focus:font-semibold peer-focus:text-blue-400">Username</label>
                            </div>
                            <div className="relative group">
                                <input type="password" id="password" className="peer w-full bg-slate-800/50 border border-slate-600 rounded-lg px-4 pt-6 pb-2 text-white focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all placeholder-transparent"
                                    placeholder="Password" value={password} onChange={e => setPassword(e.target.value)} required />
                                <label htmlFor="password" className="absolute left-4 top-2 text-xs font-semibold text-emerald-400 transition-all peer-placeholder-shown:text-sm peer-placeholder-shown:font-normal peer-placeholder-shown:text-slate-400 peer-placeholder-shown:top-4 peer-focus:top-2 peer-focus:text-xs peer-focus:font-semibold peer-focus:text-emerald-400">Password</label>
                            </div>
                            <button className="w-full bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white font-semibold py-3 rounded-lg shadow-lg shadow-blue-500/25 transition-all transform hover:-translate-y-0.5">
                                Enter CRM
                            </button>
                        </form>
                    </div>
                </div>
            )
        };

        const Dashboard = () => {
            const [data, setData] = useState(null);
            const [error, setError] = useState(null);
            const [deleteConfirm, setDeleteConfirm] = useState(null);

            useEffect(() => {
                api.get('dashboard/')
                    .then(res => setData(res.data))
                    .catch(err => {
                        if (err.response?.status === 401 || err.response?.status === 403) {
                            window.location.href = '/login/?next=/admin-dashboard/';
                        }
                        setError("Session expired or access denied. Redirecting to login...")
                    });
            }, []);

            if (error) return <Layout><div className="text-red-400 p-8">{error}</div></Layout>;
            if (!data) return <Layout><div className="text-white p-8">Loading dashboard analytics...</div></Layout>;

            return (
                <Layout>
                    <ConfirmModal isOpen={!!deleteConfirm} {...deleteConfirm} onCancel={() => setDeleteConfirm(null)} />
                    <div className="mb-8">
                        <h2 className="text-3xl font-bold text-white tracking-tight">Performance Overview</h2>
                        <p className="text-slate-400 mt-1">Real-time metrics for {data.company_name}</p>
                    </div>

        const BillViewerModal = ({ lead, onClose }) => {
            const bills = [lead.wapda_bill_url, lead.wapda_bill_2_url, lead.wapda_bill_3_url].filter(Boolean);
            const [activeBill, setActiveBill] = useState(bills[0]);
            const [zoom, setZoom] = useState(1);

            return (
                <div className="fixed inset-0 bg-slate-900/90 backdrop-blur-md flex justify-center items-center z-50 p-4">
                    <div className="glass-card w-full max-w-4xl h-[90vh] flex flex-col overflow-hidden">
                        <div className="flex justify-between items-center p-4 border-b border-slate-700/50">

                            <div className="flex gap-2">
                                <button onClick={() => setZoom(z => Math.min(z + 0.25, 3))} className="bg-slate-800 p-2 rounded hover:bg-slate-700 text-white"><Icon name="ZoomIn" size={20} /></button>
                                <button onClick={() => setZoom(z => Math.max(z - 0.25, 0.5))} className="bg-slate-800 p-2 rounded hover:bg-slate-700 text-white"><Icon name="ZoomOut" size={20} /></button>
                                <button onClick={onClose} className="bg-red-500/20 text-red-400 p-2 rounded hover:bg-red-500/30"><Icon name="X" size={20} /></button>
                            </div>
                        </div>
                        <div className="flex flex-1 overflow-hidden">
                            <div className="w-48 border-r border-slate-700/50 p-4 space-y-2 overflow-y-auto">
                                {bills.map((b, i) => (
                                    <button key={i} onClick={() => { setActiveBill(b); setZoom(1); }} className={`w-full text-left p-3 rounded-lg border ${activeBill === b ? 'border-blue-500 bg-blue-500/10 text-white' : 'border-slate-700 text-slate-400 hover:bg-slate-800'}`}>
                                        Bill Month {i + 1}
                                    </button>
                                ))}
                            </div>
                            <div className="flex-1 overflow-auto p-4 flex justify-center items-start bg-black/50">
                                {activeBill ? (
                                    <img src={activeBill} alt="Bill" style={{ transform: `scale(${zoom})`, transformOrigin: 'top center', transition: 'transform 0.2s' }} className="max-w-full" />
                                ) : <div className="text-slate-500 mt-20">No bill uploaded</div>}
                            </div>
                        </div>
                    </div>
                </div>
            )
        };

        const Accordion = ({ title, isOpen, onToggle, children }) => (
            <div className="border border-slate-700/50 rounded mb-2 overflow-hidden bg-slate-800/30">
                <button type="button" onClick={onToggle} className="w-full flex justify-between items-center p-4 hover:bg-slate-700/50 transition-colors">
                    <span className="font-bold text-slate-200">{title}</span>
                    <Icon name={isOpen ? "ChevronUp" : "ChevronDown"} size={20} className="text-slate-400" />
                </button>
                {isOpen && <div className="p-4 border-t border-slate-700/50 bg-slate-900/50 space-y-4">{children}</div>}
            </div>
        );

        const QuotationBuilderPage = () => {
            const { leadId } = useParams();
            const navigate = useNavigate();
            const [lead, setLead] = useState(null);
            const [loadingLead, setLoadingLead] = useState(true);

            const [openSection, setOpenSection] = useState('system');

            const [engineeringProps, setEngineeringProps] = useState({
                tariff: '50',
                voltage: '48',
                peakLoadKw: '5',
                backupHours: '4',
                monthlyBill: '0',
            });

            const [formData, setFormData] = useState({
                system_size: '5.0', monthly_units: '0', peak_load_kw: '5.0',
                panel_brand: 'Longi', panel_wattage: '550', panel_count: '0', panel_unit_price: '0',
                inverter_brand: 'Inverex', inverter_type: 'Hybrid', inverter_size_kw: '5.0', inverter_unit_price: '0',
                battery_type: 'lithium', battery_brand: 'Pylontech', battery_size_kwh: '4.8', battery_backup_hours: '4', battery_unit_price: '0',
                structure_type: 'L2', structure_material: 'Galvanized Iron', mounting_structure_cost: '0',
                dc_wire_size_mm: '6mm', dc_wire_length_m: '0', dc_wire_unit_price: '0',
                ac_wire_size_mm: '10mm', ac_wire_length_m: '0', ac_wire_unit_price: '0',
                breaker_type: 'MCB', breaker_rating: '63A', breaker_count: '0', breaker_unit_price: '0',
                spd_type: 'Type 2', spd_count: '0', spd_unit_price: '0',
                earth_bore_qty: '0', earth_bore_rate: '0',

                // New Electrical & Protection Components
                db_size: '6 Way', db_rate: '0', db_qty: '1',
                wiring_cost: '0', earthing_cost: '0',
                breaker_items: [
                    { type: 'MCB', amp: '32A', qty: '1', rate: '0' },
                    { type: 'SPD', amp: 'Type 2', qty: '1', rate: '0' }
                ],

                // Miscellaneous Items
                miscellaneous_items: [],

                // Tax & Pages
                tax_type: 'percentage',
                include_pages: ['summary', 'terms', 'technical', 'signature'],

                discount: '0', installation_cost: '0', net_metering_cost: '0', transport_cost: '0',
                tax_percentage: '0', tax_amount: '0',
                valid_until: new Date(Date.now() + 15 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
                load_details: {},
                change_notes: '',
                negotiation_notes: ''
            });

            const [isManual, setIsManual] = useState(false);

            const [loading, setLoading] = useState(false);
            const [generatedQuote, setGeneratedQuote] = useState(null);
            const [editingQuote, setEditingQuote] = useState(null);
            const [negotiationMode, setNegotiationMode] = useState(false);
            const [deleteConfirm, setDeleteConfirm] = useState(null);
            const toast = useToast();

            const queryParams = new URLSearchParams(window.location.search);
            const editId = queryParams.get('edit');

            useEffect(() => {
                const loadData = async () => {
                    try {
                        let currentLead = null;
                        if (leadId && leadId !== 'new' && leadId !== 'none') {
                            const leadRes = await api.get(`contact/${leadId}/`);
                            currentLead = leadRes.data;
                            setLead(currentLead);
                        }

                        if (editId) {
                            const quoteRes = await api.get(`quotations/${editId}/`);
                            const q = quoteRes.data;
                            setEditingQuote(q);
                            setNegotiationMode(q.is_negotiation_mode);

                            if (!currentLead && q.lead) {
                                const leadRes = await api.get(`contact/${q.lead}/`);
                                setLead(leadRes.data);
                            }

                            // Populate formData from existing quote
                            setFormData(prev => ({
                                ...prev,
                                ...q,
                                // Ensure nested objects are handled if they come back as strings or objects
                                breaker_items: typeof q.breaker_items === 'string' ? JSON.parse(q.breaker_items) : (q.breaker_items || []),
                                miscellaneous_items: typeof q.miscellaneous_items === 'string' ? JSON.parse(q.miscellaneous_items) : (q.miscellaneous_items || []),
                                load_details: typeof q.load_details === 'string' ? JSON.parse(q.load_details) : (q.load_details || {}),
                                change_notes: '', // Reset change notes for new version
                            }));
                        } else if (currentLead) {
                            // Initial setup for new quote from lead
                            let loadObj = {};
                            try {
                                const rawLoad = currentLead.appliance_data;
                                loadObj = typeof rawLoad === 'string' ? JSON.parse(rawLoad) : (rawLoad || {});
                            } catch (e) { }

                            setFormData(prev => ({ ...prev, load_details: loadObj }));
                            setEngineeringProps(prev => ({
                                ...prev,
                                monthlyBill: currentLead.monthly_bill || '0',
                                backupHours: currentLead.desired_backup_hours || '4'
                            }));
                        }
                    } catch (e) {
                        console.error(e);
                        alert("Error loading data");
                    } finally {
                        setLoadingLead(false);
                    }
                };
                loadData();
            }, [leadId, editId]);

            // Engineering Calculations Logic
            useEffect(() => {
                if (loadingLead || editingQuote || isManual) return; // Don't auto-calculate if editing an existing quote or manual override

                const num = (val) => parseFloat(val) || 0;
                const tariff = num(engineeringProps.tariff) || 50;
                const bill = num(engineeringProps.monthlyBill);
                const voltage = num(engineeringProps.voltage) || 48;
                const peakLoadKw = num(engineeringProps.peakLoadKw) || 5;
                const backupHours = num(engineeringProps.backupHours) || 4;
                const panelWatt = num(formData.panel_wattage) || 550;

                // Units = bill / tariff
                const units = bill / tariff;

                // Daily Units = Units / 30
                const dailyUnits = units / 30;

                // System Size = Daily Units / 5.5
                let systemSizeKw = dailyUnits / 5.5;

                // System size should at least support the peak load if hybrid/off-grid, but we use max of both for safe design
                if (peakLoadKw > systemSizeKw) {
                    systemSizeKw = peakLoadKw;
                }

                if (systemSizeKw < 1) systemSizeKw = 3.0; // Minimum viable system

                // Panels = (kW * 1000) / panel_watt
                const panels = Math.ceil((systemSizeKw * 1000) / panelWatt);

                // Load = peakLoadKw * 1000
                const peakLoadWatts = peakLoadKw * 1000;

                // Battery (Ah) = (Load * backup_hours) / (Voltage * 0.85)
                const batteryAh = (peakLoadWatts * backupHours) / (voltage * 0.85);
                const batteryKwh = (batteryAh * voltage) / 1000;

                // Breaker (A) = Load / 220 * 1.25
                const breakerA = Math.ceil((peakLoadWatts / 220) * 1.25);

                setFormData(prev => ({
                    ...prev,
                    system_size: systemSizeKw.toFixed(1),
                    peak_load_kw: peakLoadKw.toFixed(1),
                    monthly_units: units.toFixed(0),
                    panel_count: panels.toString(),
                    inverter_size_kw: systemSizeKw.toFixed(1),
                    battery_size_kwh: batteryKwh.toFixed(1),
                    battery_backup_hours: backupHours.toString(),
                    breaker_rating: `${breakerA}A`
                }));
            }, [engineeringProps, formData.panel_wattage, loadingLead]);

            const handleChange = (field, value) => {
                setFormData(prev => {
                    const num = (val) => parseFloat(val) || 0;
                    let next = { ...prev, [field]: value };

                    // Smart Tax Sync
                    if (field === 'tax_percentage') {
                        const sub = calculateSubtotal();
                        next.tax_amount = ((num(value) / 100) * sub).toFixed(2);
                    } else if (field === 'tax_amount') {
                        const sub = calculateSubtotal();
                        if (sub > 0) {
                            next.tax_percentage = ((num(value) / sub) * 100).toFixed(2);
                        }
                    } else if (field === 'system_size' || field === 'inverter_size_kw') {
                        setIsManual(true);
                    }
                    return next;
                });
            };

            const handleEngineeringChange = (field, value) => {
                setEngineeringProps(prev => ({ ...prev, [field]: value }));
            };

            const num = (val) => parseFloat(val) || 0;

            const calculateSubtotal = () => {
                let total = (
                    (num(formData.panel_count) * num(formData.panel_unit_price)) +
                    num(formData.inverter_unit_price) +
                    num(formData.battery_unit_price) +
                    num(formData.mounting_structure_cost) +
                    (num(formData.breaker_count) * num(formData.breaker_unit_price)) +
                    (num(formData.spd_count) * num(formData.spd_unit_price)) +
                    (num(formData.earth_bore_qty) * num(formData.earth_bore_rate)) +
                    num(formData.installation_cost) +
                    num(formData.net_metering_cost) +
                    num(formData.transport_cost) +
                    // Electricals
                    (num(formData.db_qty) * num(formData.db_rate))
                );

                // Structured Breakers
                formData.breaker_items.forEach(b => {
                    total += num(b.qty) * num(b.rate);
                });

                // Miscellaneous Items
                formData.miscellaneous_items.forEach(item => {
                    total += num(item.qty) * num(item.price);
                });

                return total;
            };

            const subtotal = calculateSubtotal();

            // Tax Calculation: Enhanced
            const getTaxAmount = () => {
                if (formData.tax_type === 'percentage') {
                    return (subtotal - num(formData.discount)) * (num(formData.tax_percentage) / 100);
                }
                return num(formData.tax_amount);
            };

            const calculatedTax = getTaxAmount();
            const finalPrice = subtotal - num(formData.discount) + calculatedTax;

            // Savings = bill * 0.7
            const monthlySavings = num(engineeringProps.monthlyBill) * 0.7;

            // ROI = system_cost / (savings * 12)
            const roiYears = monthlySavings > 0 ? (finalPrice / (monthlySavings * 12)) : 0;

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    const payload = {
                        lead: lead.id,
                        customer_name: lead.name || 'Unknown',
                        customer_phone: lead.phone || '',
                        address: lead.city_area || 'N/A',
                        ...formData,
                        inverter: `${formData.inverter_size_kw}kW ${formData.inverter_type}`,
                        subtotal: subtotal,
                        tax_amount: calculatedTax,
                        total_cost: finalPrice,
                        monthly_savings: parseFloat(monthlySavings).toFixed(2),
                        roi_years: parseFloat(roiYears).toFixed(2),
                        valid_until: formData.valid_until,
                        load_details: formData.load_details,
                        total_load_watts: Object.entries(formData.load_details).reduce((acc, [k, v]) => {
                            const watts = { fans: 80, lights: 15, fridge: 300, motors: 750 };
                            if (k === 'acs' && Array.isArray(v)) {
                                return acc + v.reduce((sum, ton) => sum + (ton == 1 ? 1200 : ton == 1.5 ? 1800 : 2400), 0);
                            }
                            return acc + ((parseInt(v) || 0) * (watts[k] || 0));
                        }, (parseInt(formData.load_details.custom) || 0)),
                        status: 'draft',
                        parent_quotation: editingQuote ? editingQuote.id : null,
                        is_negotiation_mode: negotiationMode
                    };
                    const res = await api.post('quotations/', payload);
                    setGeneratedQuote(res.data);
                    toast(editingQuote ? "Revision created successfully!" : "Quotation generated!");
                } catch (e) { alert("Failed to build quote: " + JSON.stringify(e.response?.data || e.message)); } finally { setLoading(false); }
            };

            const finalizeQuote = async () => {
                if (!editingQuote) return;
                setDeleteConfirm({
                    title: "Finalize Quotation?",
                    message: "Are you sure you want to finalize and lock this quotation? No further revisions can be made.",
                    onConfirm: async () => {
                        setLoading(true);
                        try {
                            await api.post(`quotations/${editingQuote.id}/finalize/`);
                            toast("Quotation finalized and locked!", "success");
                            navigate('/admin-dashboard/quotations');
                        } catch (e) { alert("Finalization failed: " + e.message); } finally { setLoading(false); setDeleteConfirm(null); }
                    }
                });
            };

            const sendWhatsApp = () => {
                const text = `Hello ${lead.name}, your professional solar quotation for ${formData.system_size}kW is ready. Final cost: Rs ${finalPrice.toLocaleString()}. Download your premium PDF proposal here: ${window.location.origin}/api/quotations/${generatedQuote.id}/pdf/`;
                window.open(`https://wa.me/${lead.phone.replace(/[^0-9]/g, '')}?text=${encodeURIComponent(text)}`, '_blank');
            };

            const renderInputField = (label, field, type = "text", className = "") => (
                <div className={className}>
                    <label className="block text-slate-400 mb-1 text-xs uppercase tracking-wider">{label}</label>
                    <input type={type} required disabled={editingQuote?.is_final} className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white focus:border-emerald-500 outline-none disabled:opacity-50" value={formData[field]} onChange={e => handleChange(field, e.target.value)} />
                </div>
            );

            const renderUnitWithTotal = (label, countField, priceField, className = "") => {
                const total = num(formData[countField]) * num(formData[priceField]);
                return (
                    <div className={className}>
                        <label className="block text-slate-400 mb-1 text-xs uppercase tracking-wider">{label}</label>
                        <input type="number" required disabled={editingQuote?.is_final} className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white focus:border-emerald-500 outline-none disabled:opacity-50" value={formData[priceField]} onChange={e => handleChange(priceField, e.target.value)} />
                        {total > 0 && <div className="text-xs text-emerald-400 font-semibold text-right mt-1">Total: Rs {total.toLocaleString()}</div>}
                    </div>
                );
            };

            const renderEngField = (label, field, type = "text", className = "") => (
                <div className={className}>
                    <label className="block text-slate-400 mb-1 text-xs uppercase tracking-wider">{label}</label>
                    <input type={type} required className="w-full bg-blue-900/20 border border-blue-500/30 rounded px-3 py-2 text-blue-100 focus:border-blue-500 outline-none" value={engineeringProps[field]} onChange={e => handleEngineeringChange(field, e.target.value)} />
                </div>
            );

            if (loadingLead) return <Layout><div className="text-white p-8">Loading Lead Information...</div></Layout>;

            return (
                <Layout>
                    <ConfirmModal

        const LeadsList = () => {
            const [leads, setLeads] = useState([]);
            const [searchTerm, setSearchTerm] = useState('');
            const [statusFilter, setStatusFilter] = useState('');
            const [cityFilter, setCityFilter] = useState('');
            const [viewBillLead, setViewBillLead] = useState(null);
            const [expandedLead, setExpandedLead] = useState(null);
            const [deleteConfirm, setDeleteConfirm] = useState(null);
            const navigate = useNavigate();
            const toast = useToast();

            const fetchLeads = () => {
                api.get('contact/')
                    .then(res => setLeads(res.data))
                    .catch(err => { if (err.response?.status === 401) window.location.href = '/admin-login'; });
            };

            useEffect(() => { fetchLeads(); }, []);

            const updateStatus = (id, status) => {
                api.patch(`contact/${id}/`, { lead_status: status })
                    .then(() => { fetchLeads(); toast('Lead status updated!'); })
                    .catch(() => toast('Update failed', 'error'));
            };

            const convertToProject = (lead) => {
                const projectData = {
                    title: `Project: ${lead.name}`,
                    lead: lead.id,
                    status: 'pending',
                    location: lead.city_area,
                    system_size_kw: (lead.total_load_watts / 1000).toFixed(2),
                    notes: `Converted from lead. Phone: ${lead.phone}`
                };
                api.post('projects/', projectData)
                    .then(() => {
                        updateStatus(lead.id, 'closed');
                        toast('Converted to Project successfully!');
                        navigate('/admin-dashboard/projects');
                    })
                    .catch(err => toast('Conversion failed: ' + JSON.stringify(err.response?.data), 'error'));
            };

            const filteredLeads = leads.filter(l => {
                const matchesSearch = l.name.toLowerCase().includes(searchTerm.toLowerCase()) || l.phone.includes(searchTerm);
                const matchesStatus = !statusFilter || l.lead_status === statusFilter;
                const matchesCity = !cityFilter || (l.city_area && l.city_area.toLowerCase().includes(cityFilter.toLowerCase()));
                return matchesSearch && matchesStatus && matchesCity;

                                <option value="won">Won</option>

                                        <th className="p-4 font-semibold">Bills</th>
                                        <th className="p-4 font-semibold">Status</th>

                                                    <p className="text-white font-medium">{lead.name}</p>
                                                    <p className="text-slate-400 text-xs">{lead.phone}</p>
                                                </td>
                                                <td className="p-4 text-slate-300 text-sm">{lead.city_area || '—'}</td>

                                                        onChange={(e) => updateStatus(lead.id, e.target.value)}

                                                        <option value="lost">LOST</option>
                                                    </select>

                                                    <button onClick={() => setExpandedLead(expandedLead === lead.id ? null : lead.id)} className="bg-slate-700/50 text-slate-300 hover:text-white px-2 py-1.5 rounded-lg transition-all text-xs font-bold flex items-center shadow-lg shadow-slate-900/50">
                                                        <Icon name={expandedLead === lead.id ? "ChevronUp" : "ChevronDown"} size={14} />
                                                    </button>
                                                    <button onClick={() => navigate(`/admin-dashboard/quotation-builder/${lead.id}`)} className="bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 hover:bg-emerald-600 hover:text-white px-3 py-1.5 rounded-lg transition-all text-xs font-bold flex items-center gap-1 shadow-lg shadow-emerald-500/10">
                                                        <Icon name="PenTool" size={12} /> Build Quote

                                                        <Icon name="Rocket" size={12} /> Convert
                                                    </button>
                                                </td>

                                                                </div>
                                                            </div>
                                                            <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700/50">

                                                                <div className="space-y-2 text-sm text-slate-300">
                                                                    <div className="flex justify-between"><span className="text-slate-500">Monthly Bill:</span> <span className="font-medium text-white">Rs {lead.monthly_bill || 0}</span></div>
                                                                    <div className="flex justify-between"><span className="text-slate-500">Backup Needed:</span> <span className="font-medium text-white">{lead.desired_backup_hours || 0} Hrs</span></div>
                                                                    <div className="flex justify-between"><span className="text-slate-500">Earth Bore:</span> <span className="font-medium text-white">{lead.wants_earth_bore ? 'Yes' : 'No'}</span></div>
                                                                    <div className="flex justify-between"><span className="text-slate-500">Property:</span> <span className="font-medium text-white capitalize">{lead.property_type || 'Home'}</span></div>
                                                                </div>
                                                            </div>
                                                            {(() => {
                                                                const rawData = lead.appliance_data;
                                                                if (!rawData) return null;
                                                                let dataObj = {};
                                                                try {
                                                                    dataObj = typeof rawData === 'string' ? JSON.parse(rawData) : rawData;
                                                                } catch (e) { return null; }

                                                                const excludeKeys = ['fans', 'lights', 'ac', 'fridge', 'motors', 'computers', 'iron', 'heater', 'other_load_watts', 'wants_earth_bore', 'desired_backup_hours', 'property_type'];
                                                                const filteredKeys = Object.keys(dataObj).filter(k => !excludeKeys.includes(k) && dataObj[k] !== "" && dataObj[k] !== null);

                                                                if (filteredKeys.length === 0 && (!dataObj.acs || dataObj.acs.length === 0)) return null;

                                                                return (
                                                                    <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700/50">
                                                                        <h4 className="text-amber-400 font-bold text-xs uppercase tracking-widest mb-3 flex items-center gap-2"><Icon name="List" size={14} /> Additional Information</h4>
                                                                        <div className="space-y-2 text-sm text-slate-300 max-h-48 overflow-y-auto pr-2 custom-scrollbar">
                                                                            {dataObj.acs && Array.isArray(dataObj.acs) && dataObj.acs.length > 0 && (
                                                                                <div className="mb-2">
                                                                                    <span className="text-slate-500 block mb-1">AC Details:</span>
                                                                                    {dataObj.acs.map((ac, idx) => (
                                                                                        <div key={idx} className="ml-2 text-white font-medium text-xs bg-slate-900/50 px-2 py-1 rounded mb-1">• AC #{idx + 1}: {ac.ton} Ton {ac.type || ''}</div>
                                                                                    ))}
                                                                                </div>
                                                                            )}
                                                                            {filteredKeys.filter(k => k !== 'acs').map(key => {
                                                                                const formatKey = key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                                                                                let val = dataObj[key];
                                                                                if (typeof val === 'boolean') val = val ? 'Yes' : 'No';
                                                                                else if (val === '1' && (key === 'washing_machine' || key === 'deep_freezer' || key === 'fridge_inv' || key === 'fridge_non')) val = 'Yes';
                                                                                else if (val === '0') val = 'No';
                                                                                return (
                                                                                    <div key={key} className="flex justify-between items-start border-b border-slate-700/30 pb-1 mb-1 last:border-0">
                                                                                        <span className="text-slate-500">{formatKey}:</span>
                                                                                        <span className="font-medium text-white text-right break-words">{String(val)}</span>
                                                                                    </div>
                                                                                );
                                                                            })}
                                                                        </div>
                                                                    </div>
                                                                );
                                                            })()}
                                                        </div>
                                                    </td>
                                                </tr>
                                            )}
                                        </React.Fragment>
                                    ))}
                                    {filteredLeads.length === 0 && <tr><td colSpan="5" className="p-12 text-center text-slate-500 italic">No leads matching your criteria.</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </Layout>
            )
        };

                api.get('quotations/')
                    .then(res => setQuotations(res.data))
                    .catch(err => {
                        if (err.response?.status === 401) window.location.href = '/admin-login';
                    });
            }, []);

            return (
                <Layout>
                    <ConfirmModal isOpen={!!deleteConfirm} {...deleteConfirm} onCancel={() => setDeleteConfirm(null)} />
                    <div className="flex justify-between items-center mb-8">
                        <div>
                            <h2 className="text-3xl font-bold text-white tracking-tight">Quotations Pipeline</h2>
                            <p className="text-slate-400 mt-1">Review designed proposals and download PDFs</p>
                        </div>
                        <Link to="/admin-dashboard/tools/calculator" className="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg flex items-center gap-2 font-medium transition-all shadow-lg shadow-emerald-500/20">
                            <Icon name="Zap" size={18} /> Engine Calculator
                        </Link>
                    </div>

                    <div className="grid grid-cols-1 xl:grid-cols-2 gap-6">
                        {quotations.map(q => (
                            <div key={q.id} className="glass-card glow-border p-6 flex flex-col justify-between group hover:-translate-y-1 transition-all duration-300">
                                <div>
                                    <div className="flex justify-between items-start mb-4">
                                        <div>
                                            <h3 className="text-xl font-bold text-white flex items-center gap-2">
                                                {q.quotation_number || `Quote #${q.id}`}
                                                {q.version_number > 1 && <span className="text-[10px] bg-blue-600/30 text-blue-300 px-2 py-0.5 rounded-full border border-blue-500/30">v{q.version_number}</span>}

                                            <p className="text-slate-400">{q.customer_name} • {q.system_size}kW System</p>
                                        </div>
                                        <div className="flex flex-col items-end gap-1">
                                            <span className={`px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest
                                                ${q.status === 'approved' ? 'bg-emerald-500/20 text-emerald-400' :
                                                    q.status === 'sent' ? 'bg-blue-500/20 text-blue-400' :
                                                        'bg-slate-500/20 text-slate-400'}`}>

                                    </div>
                                    <div className="grid grid-cols-2 gap-4 mb-6 text-sm">
                                        <div className="bg-slate-800/50 p-3 rounded-lg border border-slate-700/50">
                                            <p className="text-slate-500 mb-1 text-[10px] uppercase">Final Cost</p>
                                            <p className="font-bold text-white">RS {parseFloat(q.total_cost).toLocaleString(undefined, { maximumFractionDigits: 0 })}</p>
                                        </div>
                                        <div className="bg-slate-800/50 p-3 rounded-lg border border-slate-700/50">
                                            <p className="text-slate-500 mb-1 text-[10px] uppercase">Configuration</p>
                                            <p className="font-bold text-white">{q.panel_count} Panels • {q.inverter_size_kw}kW</p>

                                    </div>

                                            <p className="text-[10px] text-blue-400 uppercase font-black mb-1">Revision Notes</p>
                                            <p className="text-xs text-slate-300 italic">"{q.change_notes}"</p>

        const CableSizer = () => {

            const calculateCable = (e) => {

                // Simple DC cable sizing formula: A = (2 * L * I * 0.0175) / V_drop
                const I = parseFloat(current);

                if (I && L) {
                    const drop = 48 * 0.02; // 2% of 48V

                    setVoltageDrop(drop.toFixed(2));
                    setCableSize(Math.ceil(area).toString() + " mm² (Suggested standard: " + (area <= 10 ? '10' : area <= 16 ? '16' : area <= 25 ? '25' : '35') + "mm²)");

        // Custom Animated Number Component
        const AnimatedNumber = ({ value, prefix = "", suffix = "", decimals = 0 }) => {
            const [displayValue, setDisplayValue] = useState(0);
            useEffect(() => {
                let start = 0;
                const end = parseFloat(value);
                if (start === end) return;
                const duration = 1000;
                let startTimestamp = null;
                const step = (timestamp) => {
                    if (!startTimestamp) startTimestamp = timestamp;
                    const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                    setDisplayValue(progress * (end - start) + start);
                    if (progress < 1) window.requestAnimationFrame(step);
                };
                window.requestAnimationFrame(step);
            }, [value]);

            return <span>{prefix}{displayValue.toLocaleString(undefined, { maximumFractionDigits: decimals, minimumFractionDigits: decimals })}{suffix}</span>;
        };

        const EngineCalculator = () => {
            const navigate = useNavigate();
            const [step, setStep] = useState(1);
            const [customerInfo, setCustomerInfo] = useState({ name: "", phone: "", address: "", propertyType: "home" });

            const [applianceLoad, setApplianceLoad] = useState({

            const [billFile, setBillFile] = useState(null);
            const [systemPreference, setSystemPreference] = useState({ inverterType: "Hybrid", batteryBackup: "Yes" });
            const [loading, setLoading] = useState(false);
            const [result, setResult] = useState(null);

            const steps = [
                { id: 1, title: 'Personal', icon: 'User' },
                { id: 2, title: 'Load Assessment', icon: 'Zap' },
                { id: 3, title: 'Bill & System', icon: 'Settings' },
                { id: 4, title: 'Review', icon: 'CheckCircle' }
            ];

            const handleNext = () => {
                if (step < 4) setStep(step + 1);
            };

            const handlePrev = () => {
                if (step > 1) setStep(step - 1);
            };

            const addAC = () => {
                setApplianceLoad({
                    ...applianceLoad,
                    acs: [...applianceLoad.acs, { id: Date.now(), ton: 1.5 }]
                });
            };

            const removeAC = (id) => {
                setApplianceLoad({
                    ...applianceLoad,
                    acs: applianceLoad.acs.filter(ac => ac.id !== id)
                });
            };

            const updateAC = (id, ton) => {
                setApplianceLoad({
                    ...applianceLoad,
                    acs: applianceLoad.acs.map(ac => ac.id === id ? { ...ac, ton } : ac)
                });
            };

            const addCustomLoad = () => {
                setApplianceLoad({
                    ...applianceLoad,
                    custom_loads: [...applianceLoad.custom_loads, { id: Date.now(), name: '', watts: 0 }]
                });
            };

            const removeCustomLoad = (id) => {
                setApplianceLoad({
                    ...applianceLoad,
                    custom_loads: applianceLoad.custom_loads.filter(l => l.id !== id)
                });
            };

            const updateCustomLoad = (id, field, value) => {
                setApplianceLoad({
                    ...applianceLoad,
                    custom_loads: applianceLoad.custom_loads.map(l => l.id === id ? { ...l, [field]: value } : l)
                });
            };

            const calculation = useMemo(() => {
                try {
                    let totalWatts = (Number(applianceLoad.fans) * 80) +
                        (Number(applianceLoad.lights) * 15) +
                        (Number(applianceLoad.fridge) * 350) +
                        (Number(applianceLoad.motors) * 750) +
                        (Number(applianceLoad.washing_machine) * 500) +
                        (Number(applianceLoad.iron) * 1000) +
                        (Number(applianceLoad.custom_watts) || 0);

                    if (Array.isArray(applianceLoad.acs)) {
                        applianceLoad.acs.forEach(ac => {
                            const tonVal = parseFloat(ac.ton);
                            if (tonVal === 1) totalWatts += 1200;
                            else if (tonVal === 1.5) totalWatts += 1800;
                            else if (tonVal === 2) totalWatts += 2400;
                            else if (tonVal === 4) totalWatts += 4800;
                        });
                    }

                    if (Array.isArray(applianceLoad.custom_loads)) {
                        applianceLoad.custom_loads.forEach(load => {
                            totalWatts += (Number(load.watts) || 0);
                        });
                    }

                    const kwLoad = totalWatts / 1000;
                    let kwBill = 0;

                    if (units && !isNaN(units) && parseFloat(units) > 0) {
                        const tariff = 50.0;
                        const units_consumed = parseFloat(units) / tariff;
                        kwBill = (units_consumed / 30) / 5.5;
                    }

                    let kw = Math.max(kwLoad, kwBill);
                    if (kw === 0) kw = 0;

                    // Professional Buffers
                    if (kw > 0) {
                        if (kw <= 5) kw = Math.ceil(kw);
                        else kw = Math.ceil(kw / 2) * 2; // rounds to even for larger systems
                    }

                    const cost = kw * 260000; // Rs 2.6L per kW average
                    const daily_units = kw * 5.5;
                    const monthlySavings = daily_units * 30 * 50;
                    const roiYears = monthlySavings > 0 ? (cost / (monthlySavings * 12)).toFixed(1) : 0;

                    return {
                        kw, totalWatts, cost, monthlySavings, roiYears,
                        panels: Math.ceil((kw * 1000) / 585),
                        savingsData: Array.from({ length: 12 }, (_, i) => ({
                            month: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][i],
                            savings: Math.round(monthlySavings * (1 + (Math.random() * 0.2 - 0.1)))
                        })),
                        productionData: Array.from({ length: 12 }, (_, i) => ({
                            month: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][i],
                            kwh: Math.round(kw * 5.5 * 30 * (0.8 + (Math.random() * 0.4)))
                        }))
                    };
                } catch (e) {
                    console.error("Calculation Error:", e);
                    return { kw: 0, totalWatts: 0, cost: 0, monthlySavings: 0, roiYears: 0, panels: 0, savingsData: [], productionData: [] };
                }
            }, [units, applianceLoad]);

            const handleGenerate = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    const formData = new FormData();
                    formData.append('name', customerInfo.name);
                    formData.append('phone', customerInfo.phone);
                    formData.append('installation_address', customerInfo.address);
                    formData.append('monthly_bill', units || 0);
                    formData.append('fans', applianceLoad.fans || 0);
                    formData.append('lights', applianceLoad.lights || 0);
                    formData.append('fridge', applianceLoad.fridge || 0);
                    formData.append('motors', applianceLoad.motors || 0);
                    formData.append('ac', applianceLoad.acs.length || 0);
                    formData.append('appliance_data', JSON.stringify(applianceLoad));
                    formData.append('property_type', (customerInfo.propertyType || 'home').toLowerCase());
                    formData.append('message', "Detailed Engineering Load Assessment submitted via Engineering Tools.");
                    if (billFile) formData.append('wapda_bill', billFile);

                    const leadRes = await api.post('contact/', formData, { headers: { 'Content-Type': 'multipart/form-data' } });
                    const leadId = leadRes.data.id;

                    const totalCost = calculation.cost;
                    const payload = {
                        lead: leadId,

        // ─── Project Management ───
        const ProjectManagement = () => {
            const [projects, setProjects] = useState([]);
            const [loading, setLoading] = useState(true);
            const [showModal, setShowModal] = useState(false);
            const [editProject, setEditProject] = useState(null);
            const [leads, setLeads] = useState([]);
            const [deleteConfirm, setDeleteConfirm] = useState(null);
            const toast = useToast();
            const emptyForm = { title: '', lead: '', status: 'pending', installation_date: '', system_size_kw: '', location: '', notes: '', contract_value: 0 };
            const [form, setForm] = useState(emptyForm);
            const [showPaymentModal, setShowPaymentModal] = useState(false);
            const [selectedProject, setSelectedProject] = useState(null);
            const [payments, setPayments] = useState([]);
            const [payForm, setPayForm] = useState({ amount: 0, payment_date: new Date().toISOString().split('T')[0], notes: '' });

            const fetchAll = () => {
                setLoading(true);
                Promise.all([api.get('projects/'), api.get('contact/')]).then(([pr, lr]) => {
                    setProjects(pr.data); setLeads(lr.data); setLoading(false);
                }).catch(() => setLoading(false));
            };
            useEffect(() => { fetchAll(); }, []);

            const openCreate = () => { setForm(emptyForm); setEditProject(null); setShowModal(true); };
            const openEdit = (p) => { setForm({ title: p.title, lead: p.lead || '', status: p.status, installation_date: p.installation_date || '', system_size_kw: p.system_size_kw || '', location: p.location || '', notes: p.notes || '', contract_value: p.contract_value || 0 }); setEditProject(p); setShowModal(true); };

            const openPayments = (p) => {
                setSelectedProject(p);
                setShowPaymentModal(true);
                fetchPayments(p.id);
            };

            const fetchPayments = (projectId) => {
                api.get(`project-payments/?project=${projectId}`).then(res => setPayments(res.data));
            };

            const handleAddPayment = (e) => {
                e.preventDefault();
                api.post('project-payments/', { ...payForm, project: selectedProject.id }).then(() => {
                    fetchPayments(selectedProject.id);
                    setPayForm({ amount: 0, payment_date: new Date().toISOString().split('T')[0], notes: '' });
                    fetchAll(); // Refresh project list for totals
                    toast('Payment recorded!');
                });
            };

            const handleDeletePayment = (id) => {
                api.delete(`project-payments/${id}/`).then(() => {
                    fetchPayments(selectedProject.id);
                    fetchAll();
                    toast('Payment removed');
                });
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                const req = editProject ? api.patch(`projects/${editProject.id}/`, form) : api.post('projects/', form);
                req.then(() => { setShowModal(false); fetchAll(); toast(editProject ? 'Project updated!' : 'Project created!'); })
                    .catch(() => toast('Failed to save project', 'error'));
