<style>
    .devgo-micro-footer {
        position: relative;
        overflow: hidden;
        background:
            radial-gradient(circle at 50% 0%, rgba(255, 200, 87, 0.08), transparent 34%),
            #020617;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        padding: 24px clamp(18px, 4vw, 48px) 28px;
        color: #94a3b8;
        font-family: 'Inter', system-ui, sans-serif;
    }

    .devgo-micro-footer::before {
        content: "";
        display: block;
        width: min(760px, 80vw);
        height: 1px;
        margin: 0 auto 22px;
        background: linear-gradient(90deg, transparent, rgba(255, 200, 87, 0.42), transparent);
    }

    .devgo-micro-inner {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: clamp(18px, 4vw, 48px);
        flex-wrap: wrap;
        text-align: center;
    }

    .devgo-powered-by {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 0.82rem;
        letter-spacing: 0.04em;
    }

    .devgo-brand {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #f8fafc;
        font-weight: 800;
        text-decoration: none;
        transition: color 0.25s ease, transform 0.25s ease;
    }

    .devgo-brand:hover {
        color: var(--gold);
        transform: translateY(-1px);
    }

    .devgo-logo {
        height: 18px;
        width: auto;
        border-radius: 4px;
        filter: drop-shadow(0 0 12px rgba(255, 200, 87, 0.12));
    }

    .devgo-links {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        flex-wrap: wrap;
    }

    .devgo-link {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: #94a3b8;
        text-decoration: none;
        font-size: 0.82rem;
        font-weight: 700;
        transition: color 0.25s ease, transform 0.25s ease;
    }

    .devgo-link:hover {
        color: var(--gold);
        transform: translateY(-1px);
    }

    .devgo-link i {
        width: 14px;
        height: 14px;
    }

    @media (max-width: 768px) {
        .devgo-micro-footer {
            padding-bottom: 92px;
        }
        .devgo-micro-inner {
            flex-direction: column;
            gap: 16px;
        }
    }
</style>
